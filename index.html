<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f1" />
    <meta name="description" content="What do we cook next? A shared household meal planner." />
    <title>PRABAS Food Planner</title>

    <link rel="icon" href="%BASE_URL%icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180x180.png" />

    <!-- Installed on the iPhone home screen: full screen, labelled PRABAS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PRABAS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script>
      // Apply the last theme before first paint, so dark mode doesn't flash light on open.
      try {
        var t = localStorage.getItem('prabas_theme_last')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
